name: Renovate
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [package-released]
permissions:
  contents: read
concurrency:
  group: pin-courier-public-coordinator
  cancel-in-progress: false
jobs:
  renovate:
    strategy:
      fail-fast: false
      matrix:
        target:
          - JFusco/renovate-config
          - JFusco/ui-design-brain
          - JFusco/cms-field-vocabulary
          - JFusco/brain
          - JFusco/design-passport
          - JFusco/the-office
    uses: JFusco/renovate-config/.github/workflows/renovate-run.yml@c13f985540c9c23527aede87836eb08c285548f1 # v1.0.0
    with:
      target: ${{ matrix.target }}
    secrets:
      RENOVATE_APP_CLIENT_ID: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
  forward-migrator:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'package-released'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed forwarding code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JFusco/renovate-config
          ref: 9c1895a7fe84e2de36b2a409eaae04071b9dff0b
          path: pin-courier-config
          persist-credentials: false
      - name: Mint one-destination dispatch token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: verndale
          repositories: migrator
          permission-contents: write
      - name: Submit notification without logging private responses
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DISPATCH_DESTINATION: verndale/migrator
        run: node pin-courier-config/scripts/forward-release.cjs
  forward-ai-orchestration:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'package-released'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed forwarding code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JFusco/renovate-config
          ref: 9c1895a7fe84e2de36b2a409eaae04071b9dff0b
          path: pin-courier-config
          persist-credentials: false
      - name: Mint one-destination dispatch token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: verndale
          repositories: ai-orchestration
          permission-contents: write
      - name: Submit notification without logging private responses
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DISPATCH_DESTINATION: verndale/ai-orchestration
        run: node pin-courier-config/scripts/forward-release.cjs
