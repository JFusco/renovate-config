name: Renovate

# Runs Renovate as the Pin Courier GitHub App on every repository the app is
# installed on that also has a renovate.json. Publishing repositories send a
# repository_dispatch after a release, so update PRs open within minutes; the
# schedule is the fallback when a dispatch is missed.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [package-released]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate (${{ matrix.owner }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # An installation token covers one account, so each account is its
        # own run. Add verndale once its owner approves the installation.
        owner: [JFusco]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint Pin Courier token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}

      - name: Run Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          configurationFile: runner.json
          token: ${{ steps.token.outputs.token }}
          renovate-version: 44.190.0
        env:
          LOG_LEVEL: info
