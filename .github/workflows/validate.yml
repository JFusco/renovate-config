name: Validate Pin Courier
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.14.0'
      - name: Install pinned validator and native RE2 without App secrets
        run: |
          npm install --prefix "$RUNNER_TEMP/renovate-tools" --no-audit --no-fund --save-exact renovate@44.190.0 re2@1.27.0
          echo "RENOVATE_MODULE_PATH=$RUNNER_TEMP/renovate-tools/node_modules/renovate" >> "$GITHUB_ENV"
      - name: Strict candidate preset, consumer and global profile validation
        run: node scripts/validate-renovate.mjs
      - name: Policy and runner contract tests
        run: node --test tests/*.test.mjs
